# Assembled to .pre-commit-config.yaml (core hooks + language profile fragment).
# Install once after bootstrap:  pre-commit install
# Stages: format -> lint -> test (mirrors script/cibuild order).
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-added-large-files
      - id: check-yaml
      - id: check-json

  # --- language hooks appended from profiles/<lang>/pre-commit.yaml ---
  - repo: https://github.com/biomejs/pre-commit
    rev: v0.6.1
    hooks:
      - id: biome-check
        additional_dependencies: ["@biomejs/biome@2.4.16"]
