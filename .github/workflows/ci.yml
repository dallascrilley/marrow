# CI runs the same entrypoint as local dev (script/cibuild) so they never drift.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  # A daily run on an unchanged tree. Push and pull_request triggers only prove
  # the suite passes on the day someone happens to commit; anything that depends
  # on the calendar (recency windows, expiring fixtures, cert or token lifetimes)
  # can rot silently for months between commits. This catches that within a day.
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: cibuild
        run: ./script/cibuild
